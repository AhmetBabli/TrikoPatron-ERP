
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><title>İplik Gir</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e272e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .kutu { background-color: #2f3640; padding: 40px; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #353b48; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        h2 { color: #c17f5a; border-bottom: 3px solid #c17f5a; padding-bottom: 15px; display: inline-block; font-size: 28px; margin-top:0; }
        
        /* İŞTE DÜZELTME BURADA: box-sizing ekledik, genişlikleri eşitledik */
        input, select { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 10px; 
            border: 2px solid #353b48; 
            font-weight: bold; 
            background: #dfe4ea; 
            color: #2f3640; 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box; /* Bu satır taşmaları ve kısalıkları önler */
        }
        input:focus, select:focus { border-color: #c17f5a; background: white; }

        .btn-kaydet { width: 100%; padding: 18px; background: linear-gradient(135deg, #9c5a3c, #c17f5a); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 20px; margin-top: 20px; font-weight: bold; transition: 0.3s; box-shadow: 0 5px 15px rgba(156, 90, 60, 0.4); }
        .btn-kaydet:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(156, 90, 60, 0.6); }

        .btn-ekle { background: #f39c12; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 5px; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-ekle:hover { background: #e67e22; }

        .btn-geri { display: block; margin-top: 20px; color: #7f8fa6; text-decoration: none; }
        .btn-geri:hover { color: white; }
        
        /* Gizlenebilir alanlar */
        #detayli { display: none; margin-top: 10px; border-top: 1px solid #353b48; padding-top: 10px; }
        .cuval-satir { display: flex; gap: 10px; margin-bottom: 5px; }
        .cuval-satir input { margin: 0; }
    </style>
    <script>
        function degis() {
            var secim = document.getElementById("giris_turu").value;
            if (secim === "toplu") {
                document.getElementById("tek").style.display = "block";
                document.getElementById("detayli").style.display = "none";
                document.getElementById("manuel_kilo").required = true;
            } else {
                document.getElementById("tek").style.display = "none";
                document.getElementById("detayli").style.display = "block";
                document.getElementById("manuel_kilo").required = false;
            }
        }

        function cuvalEkle() {
            var div = document.createElement("div");
            div.className = "cuval-satir";
            div.innerHTML = '<input type="number" step="0.01" name="kilo[]" placeholder="Çuval KG" required style="width:100%">';
            document.getElementById("cuvallar").appendChild(div);
            
            // Çuval sayısını güncelle (Görsel amaçlı)
            var sayi = document.querySelectorAll('input[name="kilo[]"]').length;
            document.getElementById("cuval_sayisi").value = sayi;
        }
    </script>
</head>
<body>
    <div class="kutu">
        <h2>🧶 İPLİK STOK GİRİŞİ</h2>
        {% if mesaj %}<div style="background:#1e8449; color:white; padding:15px; border-radius:10px; margin-bottom:20px; font-weight:bold;">{{ mesaj }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="iplik_cinsi" placeholder="İplik Cinsi (Örn: Yün, Pamuk)" required>
            <input type="text" name="renk" placeholder="Renk" required>
            <input type="text" name="lot_no" placeholder="Lot No (İsteğe Bağlı)">
            
            <input type="number" id="cuval_sayisi" name="cuval_adeti" placeholder="Kaç Çuval?">
            
            <select id="giris_turu" name="giris_turu" onchange="degis()">
                <option value="toplu">Toplu Kilo Gir (Tek Kalem)</option>
                <option value="detayli">Çuval Çuval Gir (Tek Tek)</option>
            </select>
            
            <div id="tek">
                <input type="number" step="0.01" id="manuel_kilo" name="manuel_toplam_kilo" placeholder="Toplam Kilo Giriniz" required>
            </div>

            <div id="detayli">
                <p style="color:#bdc3c7; font-size:14px; margin-bottom:10px;">Çuvalları aşağıya ekleyin:</p>
                <div id="cuvallar">
                    <div class="cuval-satir">
                        <input type="number" step="0.01" name="kilo[]" placeholder="1. Çuval KG">
                    </div>
                </div>
                <button type="button" class="btn-ekle" onclick="cuvalEkle()">➕ Yeni Çuval Ekle</button>
            </div>

            <button type="submit" class="btn-kaydet">DEPOYA EKLE</button>
        </form>
        <a href="/" class="btn-geri">⬅ Ana Menüye Dön</a>
    </div>
</body>
</html>
