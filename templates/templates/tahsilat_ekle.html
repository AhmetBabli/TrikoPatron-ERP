<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tahsilat Ekle</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .kutu {
            background-color: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #465f75;
        }

        h2 { margin-bottom: 25px; color: #2ecc71; border-bottom: 2px solid #2ecc71; display: inline-block; padding-bottom: 10px; }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #2c3e50;
            background-color: #ecf0f1;
            color: #2c3e50;
            font-size: 16px;
            box-sizing: border-box;
            font-weight: bold;
        }

        input:focus { outline: none; border-color: #2ecc71; }

        .btn-kaydet {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-kaydet:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); }

        .btn-geri {
            display: inline-block;
            margin-top: 20px;
            color: #bdc3c7;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-geri:hover { color: white; }
    </style>
</head>
<body>

    <div class="kutu">
        <h2>💰 TAHSİLAT / ÖDEME AL</h2>
        
        {% if mesaj %}
        <div style="background:#27ae60; color:white; padding:10px; border-radius:5px; margin-bottom:15px;">
            {{ mesaj }}
        </div>
        {% endif %}

        <form method="POST">
            <label style="display:block; text-align:left; color:#bdc3c7; font-size:14px; margin-left:5px;">Açıklama (Kimden / Ne İçin?)</label>
            <input type="text" name="aciklama" placeholder="Örn: 1000 TL Nakit Alındı" required autocomplete="off">
            
            <label style="display:block; text-align:left; color:#bdc3c7; font-size:14px; margin-left:5px;">Alınan Tutar (TL)</label>
            <input type="number" step="0.01" name="tutar" placeholder="0.00" required>
            
            <button type="submit" class="btn-kaydet">KASAYA EKLE</button>
        </form>

        <a href="/" class="btn-geri">⬅ Ana Menüye Dön</a>
    </div>

</body>
</html>
