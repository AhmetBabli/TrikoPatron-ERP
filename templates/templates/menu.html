<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Atölye Finans</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .ozet-panel { display: flex; gap: 20px; margin-bottom: 20px; }
        .ozet-kutu { flex: 1; padding: 20px; border-radius: 10px; box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .kirmizi { background: #c0392b; }
        .yesil { background: #27ae60; }
        .turuncu { background: #e67e22; }
        .sayi { font-size: 28px; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .btn { background: #34495e; padding: 20px; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; border: 1px solid #465f75; display: block; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <h2>TRİKO PATRON FİNANS v3.0</h2>
        
        <div class="ozet-panel">
            <div class="ozet-kutu kirmizi">
                <div>İÇERDEKİ PARA</div>
                <div class="sayi">{{ "{:,.0f}".format(alacak) }} TL</div>
            </div>
            <div class="ozet-kutu yesil">
                <div>KASA (NAKİT)</div>
                <div class="sayi">{{ "{:,.0f}".format(kasa) }} TL</div>
            </div>
            <div class="ozet-kutu turuncu">
                <div>STOK</div>
                <div class="sayi">{{ "{:,.0f}".format(stok) }} KG</div>
            </div>
        </div>

        <div class="grid">
            <a href="/giden-is-ekle" class="btn">🧾 İş Ekle (Borç Yaz)</a>
            <a href="/tahsilat-ekle" class="btn">💰 Tahsilat (Ödeme Al)</a>
            <a href="/gider-ekle" class="btn">💸 Gider Gir (Harcama)</a>
            <a href="/iplik-gir" class="btn">🧶 İplik Girişi</a>
        </div>
        <br>
        <a href="/haftalik-hesap" class="btn" style="background: #8e44ad;">📅 HAFTALIK DETAYLI RAPOR</a>
    </div>
</body>
</html>
