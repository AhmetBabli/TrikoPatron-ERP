<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gider Ekle</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .kutu {
            background-color: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #465f75;
        }

        h2 { margin-bottom: 25px; color: #e74c3c; border-bottom: 2px solid #e74c3c; display: inline-block; padding-bottom: 10px; }
        
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #2c3e50;
            background-color: #ecf0f1;
            color: #2c3e50;
            font-size: 16px;
            box-sizing: border-box; /* Taşmayı önler */
            font-weight: bold;
        }

        input:focus, select:focus { outline: none; border-color: #e74c3c; }

        .btn-kaydet {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-kaydet:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); }

        .btn-geri {
            display: inline-block;
            margin-top: 20px;
            color: #bdc3c7;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-geri:hover { color: white; }
    </style>
</head>
<body>

    <div class="kutu">
        <h2>💸 GİDER / HARCAMA GİR</h2>
        
        {% if mesaj %}
        <div style="background:#c0392b; color:white; padding:10px; border-radius:5px; margin-bottom:15px;">
            {{ mesaj }}
        </div>
        {% endif %}

        <form method="POST">
            <label style="display:block; text-align:left; color:#bdc3c7; font-size:14px; margin-left:5px;">Gider Türü</label>
            <select name="gider_turu">
                <option value="İşçi">👷 İşçi Ödemesi / Avans</option>
                <option value="Malzeme">🧶 İplik / Malzeme</option>
                <option value="Taksit">💳 Kredi Kartı / Taksit</option>
                <option value="Yemek">🍔 Yemek / Mutfak</option>
                <option value="Diğer">Diğer Giderler</option>
            </select>
            
            <label style="display:block; text-align:left; color:#bdc3c7; font-size:14px; margin-left:5px;">Açıklama</label>
            <input type="text" name="aciklama" placeholder="Örn: Ahmet Usta Haftalık" required autocomplete="off">
            
            <label style="display:block; text-align:left; color:#bdc3c7; font-size:14px; margin-left:5px;">Tutar (TL)</label>
            <input type="number" step="0.01" name="tutar" placeholder="0.00" required>
            
            <button type="submit" class="btn-kaydet">KASADAN DÜŞ</button>
        </form>

        <a href="/" class="btn-geri">⬅ Ana Menüye Dön</a>
    </div>

</body>
</html>
